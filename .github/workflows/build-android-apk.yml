
name: Build ROC Leave and Roster APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract app package
        run: |
          mkdir app-source
          unzip -o ROC_Leave_Roster_Android_APK_Build_Package.zip -d app-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android APK
        working-directory: app-source
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          gradle assembleDebug

      - name: Provide APK download
        uses: actions/upload-artifact@v4
        with:
          name: ROC-Leave-Roster-APK
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
